# Datasource Configuration for H2
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false # Can be true for debugging but false for cleaner test logs
spring.jpa.defer-datasource-initialization=true # For Spring Boot 2.5+ if using schema.sql/data.sql with JPA

# Logging (optional - reduce verbosity for tests)
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.icegreen.greenmail=INFO

# Mail sending (disable for most controller tests, or point to test GreenMail instance)
spring.mail.host=localhost
spring.mail.port=3025 # Default GreenMail test port (from ServerSetupTest)
# spring.mail.username=
# spring.mail.password=
# spring.mail.properties.mail.smtp.auth=false
# spring.mail.properties.mail.smtp.starttls.enable=false

# Spring Security (can disable for some tests if not testing security aspects directly, or keep enabled)
# spring.security.enabled=true # Default, usually true

# Actuator (disable for tests unless needed)
management.endpoints.web.exposure.include=
management.endpoint.health.show-details=never
