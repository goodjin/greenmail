# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/greenmail_marketing?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Consider using MySQL8Dialect if appropriate for your MySQL version for better compatibility with JSON types etc.
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Mail Server Configuration (Placeholders - GreenMail itself might be used or an external server)
spring.mail.host=localhost
spring.mail.port=3025 # Example: GreenMail's default SMTP port if running embedded/separately for tests
# spring.mail.username=
# spring.mail.password=
# spring.mail.properties.mail.smtp.auth=false
# spring.mail.properties.mail.smtp.starttls.enable=false

# Server Port (Optional - Spring Boot defaults to 8080)
# server.port=8081
