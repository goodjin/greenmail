---
openapi: "3.0.0"
info:
  version: "${project.version}"
  title: GreenMail OpenAPI
  description: <p>RESTful API for GreenMail web application</p>
  license:
    name: Apache 2.0
    url: "https://www.apache.org/licenses/LICENSE-2.0.html"
paths:
  /api/configuration:
    get:
      description: Gets current GreenMail configuration
      operationId: get_configuration
      responses:
        '200':
          description: Current configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuration"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/users:
    get:
      summary: List all users
      operationId: listUsers
      tags:
        - Users
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserApiModel"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/users/{userEmail}/mailboxes:
    get:
      summary: List mailboxes for a user
      operationId: listMailboxes
      tags:
        - Mailboxes
      parameters:
        - name: userEmail
          in: path
          required: true
          description: Email address of the user
          schema:
            type: string
      responses:
        '200':
          description: A list of mailboxes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MailboxApiModel"
        '404':
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/users/{userEmail}/mailboxes/{mailboxId}/emails:
    get:
      summary: List emails in a mailbox
      operationId: listEmails
      tags:
        - Emails
      parameters:
        - name: userEmail
          in: path
          required: true
          description: Email address of the user
          schema:
            type: string
        - name: mailboxId
          in: path
          required: true
          description: ID of the mailbox (e.g., INBOX)
          schema:
            type: string
      responses:
        '200':
          description: A list of emails
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailListItemApiModel"
        '404':
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/users/{userEmail}/mailboxes/{mailboxId}/emails/{emailId}:
    get:
      summary: Get full email content
      operationId: getEmailDetail
      tags:
        - Emails
      parameters:
        - name: userEmail
          in: path
          required: true
          description: Email address of the user
          schema:
            type: string
        - name: mailboxId
          in: path
          required: true
          description: ID of the mailbox
          schema:
            type: string
        - name: emailId
          in: path
          required: true
          description: UID of the email
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Detailed information about an email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDetailApiModel"
        '404':
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      summary: Delete an email
      operationId: deleteEmail
      tags:
        - Emails
      parameters:
        - name: userEmail
          in: path
          required: true
          description: Email address of the user
          schema:
            type: string
        - name: mailboxId
          in: path
          required: true
          description: ID of the mailbox
          schema:
            type: string
        - name: emailId
          in: path
          required: true
          description: UID of the email
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Email deleted successfully
        '404':
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/users/{userEmail}/mailboxes/{mailboxId}/emails/{emailId}/attachments/{attachmentFilename}:
    get:
      summary: Download an attachment
      operationId: downloadAttachment
      tags:
        - Emails
      parameters:
        - name: userEmail
          in: path
          required: true
          description: Email address of the user
          schema:
            type: string
        - name: mailboxId
          in: path
          required: true
          description: ID of the mailbox
          schema:
            type: string
        - name: emailId
          in: path
          required: true
          description: UID of the email
          schema:
            type: integer
            format: int64
        - name: attachmentFilename
          in: path
          required: true
          description: Filename of the attachment
          schema:
            type: string
      responses:
        '200':
          description: Attachment file
          content:
            application/octet-stream: {} # Actual content type will vary
        '404':
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

components:
  schemas:
    Configuration:
      type: object
      properties:
        defaultHostname:
          type: string
        portOffset:
          type: integer
          format: int32
        users:
          type: "array"
          description: Configured users for authentication
          items:
            $ref: "#/components/schemas/User"
        serviceConfigurations:
          type: array
          items:
            $ref: "#/components/schemas/ServiceConfiguration"
      required:
        - serviceConfigurations
    User:
      type: object
      required:
        - login
        - email
      properties:
        login:
          type: string
        email:
          type: string
    ServiceConfiguration:
      type: object
      properties:
        protocol:
          description: Service protocol for receiving or sending emails.
          type: string
          enum:
            - pop3
            - pop3s
            - imap
            - imaps
            - smtp
            - smtps
        hostname:
          description: Service hostname or IP to bind to
          type: string
        port:
          description: Service port
          type: integer
          format: int32
      required:
        - protocol
        - hostname
        - port
    ErrorResponse:
      properties:
        message:
          type: string
      required:
        - message
    UserApiModel:
      type: object
      properties:
        email:
          type: string
          description: Email address of the user.
          example: user@example.com
    MailboxApiModel:
      type: object
      properties:
        id:
          type: string
          description: Fully qualified name of the mailbox.
          example: "user@example.com#INBOX"
        name:
          type: string
          description: Simple name of the mailbox.
          example: "INBOX"
        userEmail:
          type: string
          description: Email of the user owning this mailbox.
          example: "user@example.com"
    EmailListItemApiModel:
      type: object
      properties:
        id:
          type: string
          description: UID of the email.
          example: "123"
        from:
          type: string
          example: "sender@example.com"
        to:
          type: array
          items:
            type: string
          example: ["receiver1@example.com", "receiver2@example.com"]
        cc:
          type: array
          items:
            type: string
        bcc:
          type: array
          items:
            type: string
        subject:
          type: string
          example: "Email Subject"
        sentDate:
          type: string
          format: date-time
          description: ISO 8601 date-time.
          example: "2023-01-15T10:30:00Z"
        receivedDate:
          type: string
          format: date-time
          description: ISO 8601 date-time.
          example: "2023-01-15T10:31:00Z"
        size:
          type: integer
          format: int64
          description: Size of the email in bytes.
        unread:
          type: boolean
          description: True if the email is unread (SEEN flag is not set).
        hasAttachments:
          type: boolean
          description: True if the email has attachments.
    HeaderApiModel:
      type: object
      properties:
        name:
          type: string
          example: "Content-Type"
        value:
          type: string
          example: "text/plain"
    AttachmentApiModel:
      type: object
      properties:
        filename:
          type: string
          example: "document.pdf"
        contentType:
          type: string
          example: "application/pdf"
        size:
          type: integer
          format: int64
          description: Size of the attachment in bytes.
        contentId:
          type: string
          nullable: true
          example: "<attachment1@example.com>"
        downloadUrl:
          type: string
          example: "/api/users/user@example.com/mailboxes/INBOX/emails/123/attachments/document.pdf"
    EmailDetailApiModel:
      type: object
      properties:
        id:
          type: string
          description: UID of the email.
          example: "123"
        messageIdHeader:
          type: string
          description: Value of the Message-ID header.
          example: "<unique-id@example.com>"
        from:
          type: string
          example: "sender@example.com"
        to:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        bcc:
          type: array
          items:
            type: string
        subject:
          type: string
          example: "Detailed Email Subject"
        sentDate:
          type: string
          format: date-time
          example: "2023-01-15T10:30:00Z"
        receivedDate:
          type: string
          format: date-time
          example: "2023-01-15T10:31:00Z"
        headers:
          type: array
          items:
            $ref: "#/components/schemas/HeaderApiModel"
        bodyHtml:
          type: string
          nullable: true
          example: "<p>This is the HTML body.</p>"
        bodyText:
          type: string
          nullable: true
          example: "This is the text body."
        raw:
          type: string
          description: Full raw content of the email.
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentApiModel"
        size:
          type: integer
          format: int64
        unread:
          type: boolean
  responses: # Reusable response components
    NotFoundResponse:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ErrorResponse: # Already exists, but good to have it grouped if we add more generic responses
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
