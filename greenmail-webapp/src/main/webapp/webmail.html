<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenMail Webmail</title>
    <link rel="stylesheet" href="css/webmail.css">
</head>
<body>
    <div class="container">
        <div id="users-pane" class="pane">
            <h2>Users</h2>
            <ul id="users-list">
                <!-- Users will be loaded here -->
            </ul>
        </div>
        <div id="emails-pane" class="pane">
            <h2>Emails</h2>
            <div id="mailbox-header">
                <span id="current-mailbox"></span>
            </div>
            <ul id="emails-list">
                <!-- Email list will be loaded here -->
            </ul>
        </div>
        <div id="email-view-pane" class="pane">
            <h2>Email View</h2>
            <div id="email-content">
                <!-- Selected email content will be loaded here -->
                <div id="email-headers"></div>
                <div id="email-body">
                    <iframe id="email-body-html" sandbox="allow-same-origin" style="width:100%; height:400px; border:none;"></iframe>
                    <pre id="email-body-text" style="white-space: pre-wrap;"></pre>
                </div>
                <div id="email-attachments">
                    <h3>Attachments</h3>
                    <ul id="attachments-list"></ul>
                </div>
                <button id="delete-email-button" style="display:none;">Delete Email</button>
            </div>
            <div id="email-placeholder">Select an email to view.</div>
        </div>
    </div>
    <script src="js/webmail.js"></script></body>
</html>
